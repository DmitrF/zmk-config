# keymap-drawer config: how keys are labelled on the picture.
# https://github.com/caksoylar/keymap-drawer
parse_config:
  raw_binding_map:
    # umlauts and ß (mod-morphs: tap = small letter, s = with Shift)
    "&uml_u_behavior": {t: "ü", s: "Ü"}
    "&uml_o_behavior": {t: "ö", s: "Ö"}
    "&uml_a_behavior": {t: "ä", s: "Ä"}
    "&sz_behavior": "ß"
    # language + layer switches
    "&to_eng": {t: "→EN", h: "мова"}
    "&to_ua": {t: "→UA", h: "мова"}
    "&to_ru": {t: "→RU", h: "мова"}
    "&punkt_ua": {t: "punkt", h: "тимч. EN"}
    "&punkt_ru": {t: "punkt", h: "тимч. EN"}
    # text editing macros
    "&del_line": {t: "⌫", h: "рядок"}
    "&select_word": {t: "виділ.", h: "слово"}
    # macOS-style modifiers
    "&kp LSHFT": "⇧"
    "&kp RSHFT": "⇧"
    "&kp LEFT_SHIFT": "⇧"
    "&kp RIGHT_SHIFT": "⇧"
    "&kp LCTRL": "⌃"
    "&kp RCTRL": "⌃"
    "&kp LEFT_CONTROL": "⌃"
    "&kp RIGHT_CONTROL": "⌃"
    "&kp LALT": "⌥"
    "&kp RALT": "⌥"
    "&kp LGUI": "⌘"
    "&kp LEFT_GUI": "⌘"
    "&kp RET": "⏎"
    "&kp ENTER": "⏎"
    "&kp SPACE": "␣"
    "&kp TAB": "⇥"
    "&kp ESC": "esc"
    "&kp BACKSPACE": "⌫"
    "&kp DEL": "⌦"
    "&kp RG(BACKSPACE)": {t: "⌫", h: "до поч."}
    "&kp CAPSLOCK": "⇪"
    "&kp CAPS": "⇪"
    "&kp GLOBE": "🌐"
    "&kp RA(MINUS)": "–"
    "&kp NON_US_BACKSLASH": "§"
    "&kp LC(O)": "⌃O"
    # firmware
    "&bootloader": {t: "boot", h: "прошивка"}
    "&sys_reset": {t: "reset", h: "перезап."}
    # navigation
    "&kp UP": "↑"
    "&kp DOWN": "↓"
    "&kp LEFT": "←"
    "&kp RIGHT": "→"
    "&kp LG(LEFT)": "⇤"
    "&kp LG(RIGHT)": "⇥"
    "&kp LA(LEFT_ARROW)": {t: "←", h: "слово"}
    "&kp LA(RIGHT)": {t: "→", h: "слово"}
    "&kp LS(UP)": "⇧↑"
    "&kp LS(DOWN_ARROW)": "⇧↓"
    "&kp LS(LEFT)": "⇧←"
    "&kp LS(RIGHT)": "⇧→"
    "&kp LS(LG(LEFT_ARROW))": "⇧⇤"
    "&kp LS(LG(RIGHT))": "⇧⇥"
    "&kp LS(LA(LEFT))": {t: "⇧←", h: "слово"}
    "&kp LA(LS(RIGHT))": {t: "⇧→", h: "слово"}
    "&kp PAGE_UP": "PgUp"
    "&kp PG_DN": "PgDn"
    # mouse
    "&mkp MB1": "🖱L"
    "&mkp MB2": "🖱R"
    "&mmv MOVE_UP": "🖱↑"
    "&mmv MOVE_DOWN": "🖱↓"
    "&mmv MOVE_LEFT": "🖱←"
    "&mmv MOVE_RIGHT": "🖱→"
    "&msc SCRL_UP": "⇞ скрол"
    "&msc SCRL_DOWN": "⇟ скрол"
    # top row of base layers
    "&kp C_BRI_DN": "☀−"
