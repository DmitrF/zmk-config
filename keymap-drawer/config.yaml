    "&kp LG(GRAVE)": {t: "вікно", h: "⌘`"}
    "&kp LG(M)": {t: "згорн.", h: "⌘M"}
    "&kp LG(LBKT)": {t: "назад", h: "⌘["}
    "&kp LG(RBKT)": {t: "вперед", h: "⌘]"}
    "&kp LG(UP)": {t: "⤒", h: "початок"}
    "&kp LG(DOWN)": {t: "⤓", h: "кінець"}
    "&kp LA(DEL)": {t: "⌦", h: "слово"}
    "&kp LA(BACKSPACE)": {t: "⌫", h: "слово"}
    "&kp LG(Z)": {t: "undo", h: "⌘Z"}
    "&kp LG(LS(Z))": {t: "redo", h: "⌘⇧Z"}
    "&kp LG(X)": {t: "cut", h: "⌘X"}
    "&kp LG(C)": {t: "copy", h: "⌘C"}
